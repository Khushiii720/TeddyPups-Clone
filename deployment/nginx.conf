# Replace server_name and root with your deployment values.
server {
    listen 80;
    server_name example.com;
    root /var/www/puppy-clone/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:woff2|jpg|jpeg|png|webp|avif|mp4|svg|css|js)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
